[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind-commerce"
version = "0.2.0"
description = "Task-level recovery for agentic payments"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["rewind*"]

[tool.setuptools.package-data]
rewind = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

